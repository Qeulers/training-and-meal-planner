# Render Blueprint — https://render.com/docs/blueprint-spec
# Static-site deploy of the Vite + React port. Build runs `tsc -b && vite build`
# (see package.json "build") and publishes ./dist.
services:
  - type: web
    name: training-and-meal-planner
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # react-router uses client-side routing; serve index.html for any unknown path
    # so deep links / refreshes don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Vite inlines these at build time. Values are NOT in the repo — set them in the
    # Render dashboard (or approve on first blueprint sync). The Supabase anon key is
    # a public, RLS-guarded key, so exposing it to the client is expected.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      # Long-cache the fingerprinted assets Vite emits under /assets.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker must NOT be cached: a stale copy keeps serving an old
      # app shell, and a service worker that cannot be replaced is very hard to
      # recover from in the field. Its own cache is versioned by build id, so
      # revalidating this one file on every navigation costs nothing.
      - path: /sw.js
        name: Cache-Control
        value: no-cache

